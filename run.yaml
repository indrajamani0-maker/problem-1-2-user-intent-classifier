
setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py --question \"Summarize the entire video\""

test_commands:
  - "python -m unittest discover -s src -p 'test_*.py'"

notes: "Uses Python standard-library modules; no GPU or external dataset required."
